<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BRIDGE Audio Files</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #fafafa; }
    h1 { color: #003366; }
    a { color: #003366; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .folder { margin-bottom: 2rem; }
    ul { list-style: none; padding-left: 1rem; }
    li { margin: 0.25rem 0; }
    code { background: #eee; padding: 0.15rem 0.35rem; border-radius: 4px; }
  </style>
</head>
<body>

<h1>🔊 BRIDGE Audio Files</h1>
<p>This page lists all audio files hosted for the BRIDGE experiment.</p>
<p>Base URL: <code>https://ilariaporru.github.io/bridge-resources/audio/</code></p>

<div id="content"></div>

<script>
const owner = "IlariaPorru";
const repo = "bridge-resources";
const branch = "main";
const folder = "audio";

const container = document.getElementById("content");

async function listFolder(path) {
  const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
  const res = await fetch(api);

  if (!res.ok) {
    container.insertAdjacentHTML("beforeend", `<p>⚠️ Cannot fetch <code>${path}</code>: HTTP ${res.status}</p>`);
    return;
  }

  const items = await res.json();
  const files = items
    .map(item => {
      if (item.type === "dir") {
        return `<li>📁 <a href="${item.path.replace(folder + "/", "")}/">${item.name}/</a></li>`;
      } else {
        return `<li>🎵 <a href="${item.name}" target="_blank">${item.name}</a></li>`;
      }
    })
    .join("");

  container.insertAdjacentHTML("beforeend", `
    <h2>📁 ${path}/</h2>
    <ul>${files}</ul>
    <hr/>
  `);
}

listFolder(folder);
</script>

</body>
</html>
